# Google Cloud Build 설정
steps:
  # Docker 이미지 빌드
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-f', 'docker/Dockerfile',
      '-t', '${_IMAGE_NAME}',
      '.'
    ]
  
  # 이미지 푸시
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', '${_IMAGE_NAME}']

# 대체 변수
substitutions:
  _IMAGE_NAME: 'gcr.io/${PROJECT_ID}/discord-auto-bot'

# 옵션
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# 타임아웃
timeout: '1200s'
